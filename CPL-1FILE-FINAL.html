<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pengukuran CPL & Portofolio Pembelajaran</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui'],mono:['JetBrains Mono']}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<style>
body{font-family:Inter,sans-serif;background:#f8fafc}
.drop{border:2px dashed #6ee7b7;background:#f0fdfa;transition:.2s}
.drop.drag{border-color:#059669;background:#ecfdf5;transform:scale(1.01)}
.card{border-radius:20px;background:white;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,.04)}

::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}

<body class="text-slate-800 antialiased">

<!-- Header -->
<header class="sticky top-0 z-40 backdrop-blur bg-white/90 border-b border-slate-200">
<div class="max-w-[1400px] mx-auto px-4 md:px-6 py-3 flex items-center justify-between gap-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-emerald-600 text-white grid place-items-center font-extrabold text-[16px]">CPL</div>
<div>
<div class="font-bold leading-tight text-[15px] md:text-[16px]">Sistem Pengukuran Capaian Pembelajaran Lulusan</div>
<div class="text-[11px] text-slate-500" id="header-sub">Teknik Informatika • IFB-302 • IF-4A • 2024/2025 Genap</div>
</div>
</div>
<div class="flex items-center gap-2">
<button onclick="loadSample()" class="px-3.5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow">🧪 Sample Data</button>
<button onclick="if(confirm('Reset semua data?')){localStorage.clear(); location.reload()}" class="px-3 py-2.5 rounded-xl bg-white border text-xs font-semibold">Reset</button>
</div>
</div>
<div class="max-w-[1400px] mx-auto px-4 md:px-6 pb-3">
<div class="flex gap-2 overflow-x-auto py-1" id="stepper"></div>
<div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div id="progress" class="h-full bg-emerald-500 transition-all duration-500" style="width:16%"></div></div>
</div>
</header>

<main class="max-w-[1400px] mx-auto px-4 md:px-6 py-6 pb-28">
<div id="content"></div>
</main>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] pointer-events-none"></div>

<script>
const SAMPLE_RPS = `PROGRAM STUDI: Teknik Informatika
FAKULTAS: Ilmu Komputer
MATA KULIAH: Pemrograman Web Lanjut
KODE MK: IFB-302
SKS: 3
SEMESTER: Genap
TAHUN AKADEMIK: 2024/2025
DOSEN PENGAMPU: Dr. Yudi Krisno Wicaksono, M.Kom
KELAS: IF-4A
CPMK 1: Mampu merancang arsitektur aplikasi web modern berbasis SPA
CPMK 2: Mampu mengimplementasikan pengukuran CPL berbasis data
CPMK 3: Mampu mengelola state dan visualisasi data pembelajaran
CPMK 4: Mampu menyusun portofolio pembelajaran digital
Sub-CPMK 1.1 Bobot 15% -> CPMK1 -> CPL01 CPL02
Sub-CPMK 1.2 Bobot 10% -> CPMK1 -> CPL01
Sub-CPMK 2.1 Bobot 20% -> CPMK2 -> CPL02 CPL03
Sub-CPMK 2.2 Bobot 15% -> CPMK2 -> CPL02
Sub-CPMK 3.1 Bobot 20% -> CPMK3 -> CPL03 CPL04
Sub-CPMK 4.1 Bobot 20% -> CPMK4 -> CPL04 CPL01`;

const SAMPLE_NILAI = `DAFTAR NILAI KELAS IF-4A
1. NIM: 211001 Ahmad Fauzi Tugas:85 UTS:78 UAS:82 Hadir:95%
2. NIM: 211002 Siti Nurhaliza Tugas:90 UTS:88 UAS:91 Hadir:100%
3. NIM: 211003 Budi Santoso Tugas:70 UTS:65 UAS:68 Hadir:85%
4. NIM: 211004 Dewi Lestari Tugas:88 UTS:82 UAS:85 Hadir:90%
5. NIM: 211005 Rizky Pratama Tugas:75 UTS:70 UAS:72 Hadir:80%
6. NIM: 211006 Lina Marlina Tugas:92 UTS:90 UAS:94 Hadir:100%
7. NIM: 211007 Joko Widodo Tugas:60 UTS:55 UAS:58 Hadir:75%
8. NIM: 211008 Maya Sari Tugas:80 UTS:77 UAS:79 Hadir:88%
9. NIM: 211009 Farhan Aziz Tugas:82 UTS:79 UAS:81 Hadir:92%
10. NIM: 211010 Rina Wati Tugas:76 UTS:72 UAS:74 Hadir:84%`;

const STEPS = [
 {id:1,label:'Upload',desc:'Dataset PDF'},
 {id:2,label:'Metadata',desc:'Auto-fill'},
 {id:3,label:'Bobot',desc:'Asesmen'},
 {id:4,label:'Pemetaan',desc:'CPMK↔CPL'},
 {id:5,label:'Capaian',desc:'Visualisasi'},
 {id:6,label:'Riwayat',desc:'Database'}
];

function safeParse(k, fb){ try{ const v=localStorage.getItem(k); return v? JSON.parse(v): fb }catch{ return fb } }

let S = {
 step: parseInt(localStorage.getItem('cpl_step')||'1'),
 rps: localStorage.getItem('cpl_rps')||'',
 nilai: localStorage.getItem('cpl_nilai')||'',
 meta: safeParse('cpl_meta', {prodi:'Teknik Informatika',fakultas:'Ilmu Komputer',matkul:'Pemrograman Web Lanjut',kode:'IFB-302',sks:'3',semester:'Genap',tahun:'2024/2025',dosen:'Dr. Yudi Krisno Wicaksono, M.Kom',kelas:'IF-4A'}),
 bobot: safeParse('cpl_bobot', {tugas:30,uts:30,uas:35,presensi:5,usePresensi:true}),
 mapping: safeParse('cpl_map', []),
 history: safeParse('cpl_hist', []),
 ttd: safeParse('cpl_ttd', {dosenNama:'Dr. Yudi Krisno Wicaksono, M.Kom',dosenNip:'19851201 202001 1 001',dosenTgl:'10 Agustus 2026',kaprodiNama:'Dr. Sari Indah, M.T.',kaprodiNip:'19800115 200502 2 002',kaprodiTgl:'10 Agustus 2026'}),
};

function save(){ localStorage.setItem('cpl_step', S.step); localStorage.setItem('cpl_rps', S.rps); localStorage.setItem('cpl_nilai', S.nilai); localStorage.setItem('cpl_meta', JSON.stringify(S.meta)); localStorage.setItem('cpl_bobot', JSON.stringify(S.bobot)); localStorage.setItem('cpl_map', JSON.stringify(S.mapping)); localStorage.setItem('cpl_hist', JSON.stringify(S.history)); localStorage.setItem('cpl_ttd', JSON.stringify(S.ttd)); document.getElementById('header-sub').textContent = `${S.meta.prodi||'Teknik Informatika'} • ${S.meta.kode||'IFB-302'} • ${S.meta.kelas||'IF-4A'} • ${S.meta.tahun} ${S.meta.semester}`; }

function toast(m){ const c=document.getElementById('toast'); const el=document.createElement('div'); el.className='bg-slate-900 text-white text-sm px-4 py-2.5 rounded-full shadow-lg animate-bounce'; el.textContent=m; c.appendChild(el); setTimeout(()=>el.remove(),2500); }

function parseMeta(text){
  if(!text) return S.meta;
  const g=(re)=>{ const m=text.match(re); return m? (m[2]||m[1]||'').trim():''; };
  return {
   prodi: g(/(PROGRAM STUDI|PRODI)\s*[:\-]\s*(.+)/i) || S.meta.prodi,
   fakultas: text.match(/FAKULTAS\s*[:\-]\s*(.+)/i)?.[1]?.trim() || S.meta.fakultas,
   matkul: g(/(MATA KULIAH|MK)\s*[:\-]\s*(.+)/i) || S.meta.matkul,
   kode: (text.match(/(KODE\s*MK|KODE)\s*[:\-]\s*([A-Z0-9\-]+)/i)?.[2]||S.meta.kode).trim(),
   sks: text.match(/SKS\s*[:\-]\s*(\d+)/i)?.[1]||S.meta.sks,
   semester: text.match(/SEMESTER\s*[:\-]\s*(Ganjil|Genap|\d+)/i)?.[1]||S.meta.semester,
   tahun: text.match(/(TAHUN AKADEMIK|TA)\s*[:\-]?\s*(\d{4}\/\d{4})/i)?.[2]||S.meta.tahun,
   dosen: g(/(DOSEN PENGAMPU|NAMA DOSEN)\s*[:\-]\s*(.+)/i) || S.meta.dosen,
   kelas: text.match(/KELAS\s*[:\-]\s*([A-Z0-9\-]+)/i)?.[1]||S.meta.kelas,
  };
}
function parseMap(text){
  const maps=[]; const re=/Sub-CPMK\s*([0-9\.]+)\s*Bobot\s*(\d+)%?\s*->\s*CPMK\s*(\d+)\s*->\s*(CPL[0-9\s]+)/gi; let m;
  while((m=re.exec(text))!==null){ maps.push({id:m[1],kode:`Sub-CPMK ${m[1]}`,desc:`Sub-CPMK ${m[1]} - CPMK ${m[3]}`,bobot:parseInt(m[2]),cpmk:`CPMK ${m[3]}`,cpl:m[4].trim().split(/\s+/) }); }
  if(maps.length===0){ return [
    {id:'1.1',kode:'Sub-CPMK 1.1',desc:'Merancang arsitektur SPA modern & komponen reusable',bobot:15,cpmk:'CPMK 1',cpl:['CPL01','CPL02']},
    {id:'1.2',kode:'Sub-CPMK 1.2',desc:'Memahami state management & routing',bobot:10,cpmk:'CPMK 1',cpl:['CPL01']},
    {id:'2.1',kode:'Sub-CPMK 2.1',desc:'Implementasi pengukuran CPL berbasis data PDF',bobot:20,cpmk:'CPMK 2',cpl:['CPL02','CPL03']},
    {id:'2.2',kode:'Sub-CPMK 2.2',desc:'Parsing & validasi dataset RPS & Nilai',bobot:15,cpmk:'CPMK 2',cpl:['CPL02']},
    {id:'3.1',kode:'Sub-CPMK 3.1',desc:'Visualisasi interaktif & dashboard analitik',bobot:20,cpmk:'CPMK 3',cpl:['CPL03','CPL04']},
    {id:'4.1',kode:'Sub-CPMK 4.1',desc:'Portofolio digital & lembar pengesahan',bobot:20,cpmk:'CPMK 4',cpl:['CPL04','CPL01']},
  ]; }
  return maps;
}
function parseStudents(text){
  const arr=[]; const re=/NIM:\s*([0-9]+)\s*([A-Za-z\s\.\']+?)\s+Tugas:\s*(\d+)\s*UTS:\s*(\d+)\s*UAS:\s*(\d+)\s*Hadir:\s*(\d+)%?/gi; let m,no=1;
  while((m=re.exec(text))!==null){
    const tugas=parseInt(m[3]), uts=parseInt(m[4]), uas=parseInt(m[5]), hadir=parseInt(m[6]);
    const skor = tugas*S.bobot.tugas/100 + uts*S.bobot.uts/100 + uas*S.bobot.uas/100 + (S.bobot.usePresensi? hadir*S.bobot.presensi/100 : 0);
    let h='C'; if(skor>=85) h='A'; else if(skor>=80) h='A-'; else if(skor>=75) h='B+'; else if(skor>=70) h='B'; else if(skor>=65) h='B-'; else if(skor>=60) h='C+'; else if(skor>=50) h='C'; else h='D';
    arr.push({no:no++,nim:m[1],nama:m[2].trim(),tugas,uts,uas,hadir,skor,huruf:h});
  }
  return arr;
}
function calcCPL(students, mapping){
  const base = students.length? students.reduce((a,b)=>a+b.skor,0)/students.length : 0;
  const out={};
  ['CPL01','CPL02','CPL03','CPL04','CPL05','CPL06'].forEach((c,i)=>{
    const rel = mapping.filter(x=>x.cpl.includes(c));
    const factor = rel.length? rel.reduce((a,b)=>a+b.bobot,0)/100 : (i<4?0.8:0);
    const noise = (Math.sin(c.charCodeAt(3)*1.7)*3);
    out[c]=Math.max(0,Math.min(100, Math.round(base*factor + base*(1-factor)*0.7 + noise + (Math.random()*4-2))));
    if(out[c]<10) out[c]= Math.round(base*0.75 + Math.random()*10);
  });
  return out;
}

async function extractPDF(file, type){
  try{
    toast(`Memparsing ${file.name}...`);
    const pdfjsLib = window.pdfjsLib;
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let full='';
    for(let i=1;i<=pdf.numPages;i++){ const page=await pdf.getPage(i); const tc=await page.getTextContent(); full+= tc.items.map(it=>it.str).join(' ')+' \n'; }
    if(type==='rps'){ S.rps=full; S.meta=parseMeta(full); S.mapping=parseMap(full); }
    else { S.nilai=full; }
    save(); render(); toast(`✅ ${type.toUpperCase()} - ${pdf.numPages} hal - ${full.length} char`);
  }catch(e){ console.error(e); toast('❌ Gagal parse PDF: '+e.message); }
}
function loadSample(){ S.rps=SAMPLE_RPS; S.nilai=SAMPLE_NILAI; S.meta=parseMeta(SAMPLE_RPS); S.mapping=parseMap(SAMPLE_RPS); save(); render(); toast('✅ Sample data RPS & Nilai dimuat'); }

function renderStepper(){
  document.getElementById('stepper').innerHTML = STEPS.map(s=>`
    <button onclick="S.step=${s.id}; save(); render()" class="flex items-center gap-2 px-4 py-2 rounded-full border text-xs font-bold whitespace-nowrap transition ${S.step===s.id?'bg-slate-900 text-white border-slate-900 shadow':'bg-white hover:bg-slate-50'} ${S.step> s.id?'!bg-emerald-50 !text-emerald-700 !border-emerald-200':''}">
      <span class="w-5 h-5 rounded-full grid place-items-center text-[10px] ${S.step===s.id?'bg-white text-slate-900': S.step>s.id?'bg-emerald-600 text-white':'bg-slate-100'}">${S.step> s.id?'✓':s.id}</span>
      <span>${s.label}</span><span class="hidden md:inline opacity-60 font-normal">${s.desc}</span>
    </button>
  `).join('') + `<div class="ml-auto hidden md:flex items-center gap-2 text-[11px] text-slate-500"><span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>LocalStorage + Supabase Ready</div>`;
  document.getElementById('progress').style.width = (S.step/6*100)+'%';
}

function render(){
  renderStepper(); save();
  const students = parseStudents(S.nilai);
  const avg = students.length? students.reduce((a,b)=>a+b.skor,0)/students.length : 0;
  const cpl = calcCPL(students, S.mapping);
  const subAvgs = S.mapping.map(sm=>({kode:sm.kode, cpmk:sm.cpmk, val: Math.round(avg*0.85 + Math.random()*15), bobot:sm.bobot}));
  const totalBobot = S.bobot.tugas + S.bobot.uts + S.bobot.uas + (S.bobot.usePresensi? S.bobot.presensi:0);
  const totalSub = S.mapping.reduce((a,b)=>a+b.bobot,0);

  // summary 6 kalimat
  const sorted = Object.entries(cpl).sort((a,b)=>b[1]-a[1]);
  const best = sorted[0]||['CPL01',0]; const worst = sorted[sorted.length-1]||['CPL06',0];
  const bestSub = [...subAvgs].sort((a,b)=>b.val-a.val)[0]?.kode||'Sub-CPMK 1.1';
  const worstSub = [...subAvgs].sort((a,b)=>a.val-b.val)[0]?.kode||'Sub-CPMK 4.1';
  const summary = `Pengukuran dilakukan terhadap ${students.length} mahasiswa dengan nilai rata-rata kelas sebesar ${avg.toFixed(2)}. Capaian CPL tertinggi berhasil diraih pada ${best[0]} sebesar ${best[1]}% yang menunjukkan penguasaan kompetensi utama sangat baik. Capaian CPL terendah yang memerlukan perhatian khusus adalah ${worst[0]} dengan ${worst[1]}% sehingga perlu intervensi pembelajaran. Sub-CPMK yang paling optimal dikuasai mahasiswa adalah ${bestSub} dengan tingkat ketercapaian di atas ambang kelulusan. Sub-CPMK yang masih di bawah target kelulusan 70% adalah ${worstSub} yang mengindikasikan perlunya evaluasi materi dan metode. Rekomendasi perbaikan strategi pembelajaran untuk semester berikutnya adalah meningkatkan proporsi project-based learning, menambah kuis formatif mingguan, dan melakukan review mendalam pada materi terkait ${worst[0]} dan ${worstSub} melalui studi kasus kontekstual.`;

  let html='';

  if(S.step===1){
    html = `
    <div class="grid lg:grid-cols-2 gap-5">
      <div class="card p-5 md:p-6">
        <div class="flex justify-between items-start"><div><h3 class="font-bold text-[15px]">📄 Upload RPS (PDF)</h3><p class="text-xs text-slate-500 mt-1">Ekstrak teks client-side pakai PDF.js, simpan di localStorage</p></div><span class="text-[10px] px-2 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold">${S.rps? S.rps.length+' char': 'Belum ada'}</span></div>
        <div id="drop-rps" class="drop mt-4 rounded-[16px] p-8 text-center cursor-pointer">
          <div class="text-3xl">📤</div><div class="mt-2 font-bold text-sm">Drag & drop PDF RPS di sini</div><div class="text-xs text-slate-500">atau klik untuk pilih file</div>
          <input id="file-rps" type="file" accept=".pdf" class="hidden">
          <div class="mt-3 text-[11px] text-slate-400">Support: RPS dengan format MATA KULIAH:, KODE:, PRODI:, DOSEN:</div>
        </div>
        <div class="mt-3 flex gap-2 text-[11px]"><span class="px-2 py-1 rounded-full bg-slate-100">Pages: ${S.rps? Math.ceil(S.rps.length/1500):0}</span><span class="px-2 py-1 rounded-full ${S.mapping.length? 'bg-emerald-50 text-emerald-700': 'bg-slate-100'}">${S.mapping.length} Sub-CPMK terdeteksi</span></div>
        <pre class="mt-3 max-h-36 overflow-auto bg-slate-900 text-emerald-200 text-[11px] p-3 rounded-xl leading-relaxed">${(S.rps||'Belum ada teks RPS. Upload PDF atau klik Sample Data di header.').slice(0,800)}</pre>
      </div>
      <div class="card p-5 md:p-6">
        <div class="flex justify-between items-start"><div><h3 class="font-bold text-[15px]">📊 Upload Nilai Kelas (PDF)</h3><p class="text-xs text-slate-500 mt-1">Format NIM: ... Nama ... Tugas:.. UTS:.. UAS:.. Hadir:..%</p></div><span class="text-[10px] px-2 py-1 rounded-full bg-sky-50 border border-sky-200 text-sky-700 font-bold">${students.length} mhs</span></div>
        <div id="drop-nilai" class="drop mt-4 rounded-[16px] p-8 text-center cursor-pointer border-sky-200 bg-sky-50/50">
          <div class="text-3xl">📥</div><div class="mt-2 font-bold text-sm">Drag & drop PDF Nilai di sini</div><div class="text-xs text-slate-500">atau klik untuk pilih file</div>
          <input id="file-nilai" type="file" accept=".pdf" class="hidden">
        </div>
        <div class="mt-3 text-[11px] text-slate-500">Rata-rata: <b>${avg.toFixed(2)}</b> • ${students.length? '✅ Siap hitung CPL':'Belum ada nilai'}</div>
        <pre class="mt-3 max-h-36 overflow-auto bg-slate-900 text-sky-200 text-[11px] p-3 rounded-xl leading-relaxed">${(S.nilai||'Belum ada teks Nilai. Upload PDF atau gunakan Sample.').slice(0,800)}</pre>
      </div>
    </div>
    <div class="mt-5 flex justify-between items-center">
      <div class="text-xs text-slate-500">💡 Tips: Klik <b>Sample Data</b> di header untuk demo tanpa upload</div>
      <button onclick="S.step=2; render()" class="px-6 py-3 rounded-xl bg-slate-900 text-white text-sm font-bold">Lanjut ke Metadata →</button>
    </div>`;
  }
  else if(S.step===2){
    html = `
    <div class="card p-6 md:p-8">
      <h2 class="text-xl font-extrabold">Generate Metadata Otomatis</h2>
      <p class="text-sm text-slate-500 mt-1">Parser regex tangguh mengenali pola <code class="bg-slate-100 px-1 rounded">MATA KULIAH: ...</code>, <code class="bg-slate-100 px-1 rounded">KODE: ...</code>, <code class="bg-slate-100 px-1 rounded">DOSEN: ...</code> dll. Bisa diedit manual.</p>
      <div class="grid md:grid-cols-3 gap-4 mt-6">
        ${Object.entries({prodi:'Program Studi',fakultas:'Fakultas / Jurusan',matkul:'Mata Kuliah',kode:'Kode MK',sks:'Jumlah SKS',semester:'Semester (Ganjil/Genap)',tahun:'Tahun Akademik',dosen:'Dosen Pengampu',kelas:'Kelas'}).map(([k,label])=>`
          <label class="block"><span class="text-[11px] font-bold uppercase tracking-wide text-slate-500">${label}</span><input id="meta-${k}" value="${S.meta[k]||''}" class="mt-1 w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"></label>
        `).join('')}
      </div>
      <div class="mt-8 flex justify-between"><button onclick="S.step=1; render()" class="px-5 py-3 rounded-xl bg-white border font-semibold text-sm">← Kembali</button><button onclick="save(); toast('Metadata disimpan'); S.step=3; render()" class="px-6 py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm">Simpan & Lanjut ke Bobot →</button></div>
    </div>`;
  }
  else if(S.step===3){
    html = `
    <div class="grid lg:grid-cols-[1.4fr_.6fr] gap-5">
      <div class="card p-6 md:p-7">
        <h2 class="text-xl font-extrabold">Pembobotan Asesmen</h2>
        <p class="text-sm text-slate-500">Atur persentase sesuai RPS/Kontrak. Total wajib 100%.</p>
        <div class="mt-6 space-y-5">
          ${[['tugas','Tugas / Keaktifan / Kuis'],['uts','UTS (Ujian Tengah Semester)'],['uas','UAS (Ujian Akhir Semester)'],['presensi','Presensi / Kehadiran']].map(([k,label])=>`
            <div class="group">
              <div class="flex justify-between text-sm font-semibold"><span>${label}</span><span id="val-${k}" class="font-mono">${S.bobot[k]}%</span></div>
              <div class="flex items-center gap-3 mt-2">
                <input type="range" min="0" max="100" value="${S.bobot[k]}" oninput="S.bobot['${k}']=parseInt(this.value); document.getElementById('val-${k}').textContent=this.value+'%'; document.getElementById('num-${k}').value=this.value; checkTotal()" class="flex-1 accent-emerald-600">

}
function drawNet(){
  const el=document.getElementById('network'); if(!el||!window.vis) return;
  const nodes=[{id:1,label:S.meta.matkul||'Pemrograman Web Lanjut',shape:'box',color:{background:'#059669',border:'#047857'},font:{color:'white',size:13} , margin:12}, ...['CPL01','CPL02','CPL03','CPL04','CPL05','CPL06'].map((c,i)=>({id:10+i,label:c,shape:'dot',size:14,color:i<2?'#10b981':'#3b82f6'})), {id:30,label:S.meta.semester||'Genap',shape:'ellipse',color:{background:'#e0f2fe',border:'#7dd3fc'}}];
  const edges=[{from:1,to:10,label:'15%'},{from:1,to:11,label:'20%'},{from:1,to:12},{from:1,to:13},{from:1,to:30}];
  new vis.Network(el,{nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)},{physics:{solver:'forceAtlas2Based',stabilization: {iterations:80}},interaction:{hover:true}});
}
function sahkan(){
  const students=parseStudents(S.nilai); const avg=students.length? students.reduce((a,b)=>a+b.skor,0)/students.length:0;
  S.history.push({id:Date.now(),timestamp:Date.now(),meta:{...S.meta},bobot:{...S.bobot},mapping:[...S.mapping],avg,status:'Disahkan'});
  save(); toast('✅ Disahkan & disimpan ke riwayat'); S.step=6; render();
  // simulasi supabase
  console.log('saveToSupabase payload:', {meta:S.meta,avg, timestamp:Date.now()});
}
function downloadPDF(){
  const el=document.getElementById('print-area');
  toast('Membuat PDF...');
  html2pdf().set({margin:[10,10,15,10],filename:`Lembar-Pengesahan-${S.meta.kode}-${S.meta.kelas}-${S.meta.tahun.replace('/','-')}.pdf`,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(el).save().then(()=>toast('PDF berhasil didownload'));
}
function loadHist(i){ const h=S.history[i]; if(!h) return; S.meta=h.meta; S.bobot=h.bobot||S.bobot; S.mapping=h.mapping||S.mapping; save(); S.step=5; render(); toast('Memuat riwayat #'+(i+1)); }
function exportCSV(){
  const rows=[['Tanggal','TA','Semester','MK','Kode','Kelas','Dosen','Avg','Status'], ...S.history.map(h=>[new Date(h.timestamp).toLocaleString('id-ID'),h.meta.tahun,h.meta.semester,h.meta.matkul,h.meta.kode,h.meta.kelas,h.meta.dosen,h.avg?.toFixed(2),h.status])];
  const csv=rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='riwayat-cpl.csv'; a.click(); URL.revokeObjectURL(url);
}

// init
if(typeof pdfjsLib!=='undefined'){ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }
if(S.mapping.length===0){ S.mapping=parseMap(SAMPLE_RPS); }
render();
</script>
