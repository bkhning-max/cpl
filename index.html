<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Sequential AI Workflow</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 5px solid #ccc;
            transition: all 0.3s ease;
        }

        .card.active {
            border-left-color: #3498db;
        }

        .card.completed {
            border-left-color: #2ecc71;
        }

        .card.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #34495e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 0.95rem;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .btn-green {
            background-color: #2ecc71;
        }

        .btn-green:hover {
            background-color: #27ae60;
        }

        .output-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 15px;
            white-space: pre-wrap;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-top: 10px;
        }

        .loading-spinner {
            display: inline-block;
            margin-left: 8px;
            color: #e67e22;
            font-weight: normal;
        }

        .error-alert {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Alur Pemrosesan AI DeepSeek</h1>

    <!-- Notifikasi Error -->
    <div id="errorBox" class="error-alert"></div>

    <!-- SECTION 1: USER INPUT -->
    <div class="card active" id="cardSection1">
        <h2>1. Input Data / Prompt Awal (User)</h2>
        <textarea id="inputSection1" placeholder="Masukkan masalah, teks mentah, atau topik dasar di sini..."></textarea>
        <button id="btnProcess1" onclick="processSection1()">🚀 Kirim ke AI (Proses Section 2)</button>
    </div>

    <!-- SECTION 2: HASIL AI TAHAP 1 -->
    <div class="card disabled" id="cardSection2">
        <h2>2. Hasil AI Tahap 1 (Analisis & Ekstraksi Data) <span id="spinner2" class="loading-spinner"></span></h2>
        <div id="outputSection2" class="output-box" style="display: none;"></div>
        <button id="btnProcess2" onclick="processSection2()" style="display: none;" class="btn-green">⚡ Lanjutkan AI ke Section 3</button>
    </div>

    <!-- SECTION 3: HASIL AI TAHAP 2 -->
    <div class="card disabled" id="cardSection3">
        <h2>3. Hasil AI Tahap 2 (Rekomendasi Lanjutan & Action Plan) <span id="spinner3" class="loading-spinner"></span></h2>
        <div id="outputSection3" class="output-box" style="display: none; background-color: #eef9ff; border-color: #b8daff;"></div>
    </div>
</div>

<script>
    // Konfigurasi API DeepSeek
    const DEEPSEEK_API_KEY = 'sk-cd5496009d19455e9b2d506f7343c4f9';
    const DEEPSEEK_API_URL = 'https://api.deepseek.com/chat/completions';

    // Helper untuk memanggil API DeepSeek
    async function callDeepSeek(systemPrompt, userPrompt) {
        const response = await fetch(DEEPSEEK_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
            },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userPrompt }
                ],
                stream: false
            })
        });

        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || 'Terjadi kesalahan saat menghubungi API DeepSeek.');
        }

        const data = await response.json();
        return data.choices[0].message.content;
    }

    // Fungsi Menampilkan Error
    function showError(message) {
        const errorBox = document.getElementById('errorBox');
        if (message) {
            errorBox.innerText = message;
            errorBox.style.display = 'block';
        } else {
            errorBox.style.display = 'none';
        }
    }

    // --- PROSES SECTION 1 KE SECTION 2 ---
    async function processSection1() {
        const inputVal = document.getElementById('inputSection1').value.trim();
        if (!inputVal) {
            alert('Mohon isi data terlebih dahulu pada Section 1!');
            return;
        }

        showError(null);
        
        // UI State: Loading Section 2
        const btn1 = document.getElementById('btnProcess1');
        const card2 = document.getElementById('cardSection2');
        const spinner2 = document.getElementById('spinner2');
        const output2 = document.getElementById('outputSection2');
        const btn2 = document.getElementById('btnProcess2');

        // Reset Section 3 jika user klik ulang di Section 1
        resetSection3();

        btn1.disabled = true;
        card2.classList.remove('disabled');
        card2.classList.add('active');
        spinner2.innerText = '⏳ Sedang diproses oleh DeepSeek...';
        output2.style.display = 'none';
        btn2.style.display = 'none';

        try {
            const systemInstruction = "Anda adalah AI Analis Data. Tugas Anda adalah mengekstrak, mengkategorikan, atau merangkum poin dasar dari data user secara ringkas dan terstruktur.";
            
            // Panggil AI dengan Input dari Section 1
            const result = await callDeepSeek(systemInstruction, inputVal);

            // Tampilkan Hasil di Section 2
            output2.innerText = result;
            output2.style.display = 'block';
            btn2.style.display = 'inline-block';
            
            document.getElementById('cardSection1').classList.add('completed');
            card2.classList.add('completed');
        } catch (err) {
            showError('Error pada Section 2: ' + err.message);
        } finally {
            btn1.disabled = false;
            spinner2.innerText = '';
        }
    }

    // --- PROSES SECTION 2 KE SECTION 3 (Murni Memakai Hasil Section 2) ---
    async function processSection2() {
        const resultSection2 = document.getElementById('outputSection2').innerText;
        
        if (!resultSection2) {
            alert('Hasil dari Section 2 belum tersedia!');
            return;
        }

        showError(null);

        // UI State: Loading Section 3
        const btn2 = document.getElementById('btnProcess2');
        const card3 = document.getElementById('cardSection3');
        const spinner3 = document.getElementById('spinner3');
        const output3 = document.getElementById('outputSection3');

        btn2.disabled = true;
        card3.classList.remove('disabled');
        card3.classList.add('active');
        spinner3.innerText = '⏳ Memproses analisis tingkat lanjut...';
        output3.style.display = 'none';

        try {
            const systemInstruction = "Anda adalah AI Konsultan Strategis. Tugas Anda adalah membuat rekomendasi solusi konkret dan rencana aksi mendalam berdasarkan data hasil ekstraksi awal berikut.";
            
            // Panggil AI dengan Mengirimkan HASIL DARI SECTION 2
            const promptUserForSection3 = `Berikut adalah data hasil analisis tahap 1:\n\n${resultSection2}`;
            const result = await callDeepSeek(systemInstruction, promptUserForSection3);

            // Tampilkan Hasil di Section 3
            output3.innerText = result;
            output3.style.display = 'block';
            
            card3.classList.add('completed');
        } catch (err) {
            showError('Error pada Section 3: ' + err.message);
        } finally {
            btn2.disabled = false;
            spinner3.innerText = '';
        }
    }

    // Reset Section 3 jika alur diulang dari awal
    function resetSection3() {
        const card3 = document.getElementById('cardSection3');
        const output3 = document.getElementById('outputSection3');
        
        card3.classList.add('disabled');
        card3.classList.remove('active', 'completed');
        output3.innerText = '';
        output3.style.display = 'none';
    }
</script>

</body>
</html>
